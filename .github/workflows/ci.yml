name: CI

on:
  push:
  pull_request:

jobs:
  build-test-prove:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: alire-project/setup-alire@v4

      - name: Show Alire version
        run: alr --version

      - name: Update Alire index
        run: alr -n index --update-all

      - name: Resolve dependencies
        run: alr -n update

      - name: Build library
        run: alr -n build

      - name: Tests
        run: |
          cd tests
          alr -n build
          ./bin/tests

      - name: Showcase (write, crash, recover)
        run: |
          cd showcase
          alr -n build
          alr -n run

      - name: File device tests
        run: |
          cd devices/file
          alr -n exec -- gprbuild -P file_device_test.gpr
          alr -n exec -- gprbuild -P file_device_showcase.gpr

          device_dir="$PWD"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          cd "$temp_dir"

          "$device_dir/test_bin/file_device_test"
          "$device_dir/showcase_bin/file_device_showcase"
          "$device_dir/showcase_bin/file_device_showcase"

      - name: Install GNATprove
        uses: alire-project/alr-install@v2
        with:
          crates: gnat_native gprbuild gnatprove^16.1.0

      - name: SPARK flow analysis
        run: alr -n gnatprove --mode=flow --checks-as-errors=on

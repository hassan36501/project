name: CI

on:
  push:
  pull_request:

jobs:
  build-test-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: alire-project/setup-alire@v4

      - name: Update Alire index
        run: alr index --update-all

      - name: Show Alire version
        run: alr --version

      - name: Build library
        run: alr -n build

      - name: Tests
        run: |
          cd tests
          alr -n build
          ./bin/tests

      - name: Showcase (write, crash, recover)
        run: |
          cd showcase
          alr -n build
          alr -n run

      - name: SPARK flow analysis
        run: |
          alr -n exec -- gnatprove -P legder.gpr --mode=flow --checks-as-errors=on
name: CI

on:
  push:
  pull_request:

jobs:
  build-test-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: alire-project/setup-alire@v4

      - name: Show Alire version
        run: alr --version

      - name: Update Alire index
        run: alr -n index --update-all

      - name: Resolve dependencies
        run: alr -n update

      - name: Build library
        run: alr -n build

      - name: Tests
        run: |
          cd tests
          alr -n build
          ./bin/tests

      - name: Showcase (write, crash, recover)
        run: |
          cd showcase
          alr -n build
          alr -n run

      - name: File device demo and crash test
        run: |
          cd devices/file
          alr -n build
          ./bin/file_demo
          bash ./crash_test.sh

      - name: Install GNATprove
        run: |
          alr -n install gnatprove^16.1.0
          echo "$HOME/.alire/bin" >> "$GITHUB_PATH"

      - name: SPARK flow analysis
        run: |
          gnatprove -P legder.gpr --mode=flow --checks-as-errors=on